name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      # Single quality gate identical to `prepublishOnly`:
      # vitest run + tsc src/ + tsc __tests__/ + tsc examples/ + tsup build
      - name: Verify (test + typecheck + build)
        run: npm run verify

  node-16-compatibility:
    name: Node.js 16 package compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup build environment
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Setup minimum supported Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 16

      - name: Import package entry points
        run: |
          node --input-type=module -e "await import('./dist/index.js')"
          node -e "require('./dist/index.cjs')"
